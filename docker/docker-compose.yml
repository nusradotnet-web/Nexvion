version: '3.8'

services:
  web-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nexvion-web
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
